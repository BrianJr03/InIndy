workflows:
  android-workflow:
    name: Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - inindy_keystore
      groups:
        - inindy_secrets       # SUPABASE_URL, SUPABASE_ANON_KEY, GOOGLE_SERVICES_JSON
        - google_play          # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      vars:
        PACKAGE_NAME: "jr.brian.inindy"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          cat > "$CM_BUILD_DIR/local.properties" <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF
      - name: Write google-services.json
        script: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > "$CM_BUILD_DIR/androidApp/google-services.json"
      - name: Set build number
        script: |
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" --tracks internal || echo 0)
          BUILD_NUMBER=$(($LATEST + 1))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
      - name: Build Android App Bundle
        script: |
          ./gradlew :androidApp:bundleRelease \
            -PversionCode=$BUILD_NUMBER \
            -PversionName=1.0.$BUILD_NUMBER
    artifacts:
      - androidApp/build/outputs/**/*.aab
      - androidApp/build/outputs/**/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  ios-workflow:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: admin_role
    environment:
      ios_signing:
        provisioning_profiles:
          - inindy_app_store_profile
        certificates:
          - inindy_distribution_cert
      groups:
        - inindy_secrets       # SUPABASE_URL, SUPABASE_ANON_KEY, GOOGLE_SERVICE_INFO_PLIST
      vars:
        XCODE_PROJECT: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
        BUNDLE_ID: "jr.brian.inindy"
        APP_STORE_APP_ID: 6801234266
      xcode: latest
      java: 17
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Write local.properties
        script: |
          cat > "$CM_BUILD_DIR/local.properties" <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF
      - name: Write GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > "$CM_BUILD_DIR/iosApp/iosApp/GoogleService-Info.plist"
      - name: Set build number
        script: |
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID" || echo 0)
          BUILD_NUMBER=$(($LATEST + 1))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
      - name: Build iOS ipa
        script: |
          PROFILE=$(ls "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision | head -1)
          PROFILE_UUID=$(security cms -D -i "$PROFILE" | plutil -extract UUID raw -)
          plutil -create xml1 "$HOME/export_options.plist"
          plutil -insert method -string app-store-connect "$HOME/export_options.plist"
          plutil -insert teamID -string TRU2TKS3T4 "$HOME/export_options.plist"
          plutil -insert signingStyle -string manual "$HOME/export_options.plist"
          plutil -insert signingCertificate -string "Apple Distribution" "$HOME/export_options.plist"
          plutil -insert provisioningProfiles -dictionary "$HOME/export_options.plist"
          plutil -insert provisioningProfiles.jr\.brian\.inindy -string "$PROFILE_UUID" "$HOME/export_options.plist"
          plutil -p "$HOME/export_options.plist"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --export-options-plist "$HOME/export_options.plist" \
            --archive-flags "CURRENT_PROJECT_VERSION=$BUILD_NUMBER CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=TRU2TKS3T4 PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID CODE_SIGN_IDENTITY=\"Apple Distribution\""
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal
