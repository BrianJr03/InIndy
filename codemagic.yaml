workflows:
  android-workflow:
    name: Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - inindy_keystore
      groups:
        - inindy_secrets       # SUPABASE_URL, SUPABASE_ANON_KEY, GOOGLE_SERVICES_JSON
        - google_play          # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      vars:
        PACKAGE_NAME: "jr.brian.inindy"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          cat > "$CM_BUILD_DIR/local.properties" <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF
      - name: Write google-services.json
        script: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > "$CM_BUILD_DIR/androidApp/google-services.json"
      - name: Set build number
        script: |
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" --tracks internal || echo 0)
          BUILD_NUMBER=$(($LATEST + 1))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
      - name: Build Android App Bundle
        script: |
          ./gradlew :androidApp:bundleRelease \
            -PversionCode=$BUILD_NUMBER \
            -PversionName=1.0.$BUILD_NUMBER
    artifacts:
      - androidApp/build/outputs/**/*.aab
      - androidApp/build/outputs/**/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  ios-workflow:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: admin_role
    environment:
      ios_signing:
        provisioning_profiles:
          - inindy_app_store_profile
        certificates:
          - inindy_distribution_cert
      groups:
        - inindy_secrets       # SUPABASE_URL, SUPABASE_ANON_KEY, GOOGLE_SERVICE_INFO_PLIST
      vars:
        XCODE_PROJECT: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
        BUNDLE_ID: "jr.brian.inindy"
        APP_STORE_APP_ID: 6801234266
      xcode: latest
      java: 17
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.konan
        - ~/Library/Caches/CocoaPods
        - $HOME/Library/Developer/Xcode/DerivedData/**/SourcePackages
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Configure Gradle memory
        script: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
          kotlin.native.compiler.execution.strategy=in-process
          EOF
          cat ~/.gradle/gradle.properties
      - name: Write local.properties
        script: |
          cat > "$CM_BUILD_DIR/local.properties" <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF
      - name: Write GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > "$CM_BUILD_DIR/iosApp/iosApp/GoogleService-Info.plist"
      - name: Build iOS ipa
        script: |
          PROFILE=$(ls "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision | head -1)
          PROFILE_UUID=$(security cms -D -i "$PROFILE" | plutil -extract UUID raw -)
          python3 - "$PROFILE_UUID" <<'PYEOF'
          import plistlib, sys, os
          opts = {
              "method": "app-store-connect",
              "teamID": "TRU2TKS3T4",
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "provisioningProfiles": {"jr.brian.inindy": sys.argv[1]},
          }
          with open(os.path.expanduser("~/export_options.plist"), "wb") as f:
              plistlib.dump(opts, f)
          PYEOF
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/ios/InIndy.xcarchive" \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/InIndy.xcarchive" \
            -exportOptionsPlist "$HOME/export_options.plist" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal
